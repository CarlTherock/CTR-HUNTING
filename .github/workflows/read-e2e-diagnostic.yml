name: Read existing E2E diagnostic for PR 57
on:
  push:
    branches: [fix/hunt-balayage-et-version-visible]
    paths: [.github/workflows/read-e2e-diagnostic.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: read-e2e-pr57-42510879123
  cancel-in-progress: true
jobs:
  read-diagnostic:
    if: github.repository == 'CarlTherock/CTR-HUNTING'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Download the existing report
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: playwright-report
          run-id: 42510879123
          repository: CarlTherock/CTR-HUNTING
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pr57-existing-artifact
      - name: Read the exact diagnostic attachment from trace archives
        env:
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, zipfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'], 'pr57-existing-artifact')
          digest = '507f42727db4624f992a6758edbcd9ae16acc2d1'
          report = {'sourceRun': 42510879123, 'pullRequest': 57, 'attachmentName': 'map-render-diagnostic.json', 'attachmentSha1': digest, 'downloadOutcome': os.environ.get('DOWNLOAD_OUTCOME'), 'matches': [], 'readerErrors': []}
          for path in sorted(root.rglob('*.zip'))[:12]:
              try:
                  if path.stat().st_size > 25000000:
                      continue
                  with zipfile.ZipFile(path) as archive:
                      for item in archive.infolist():
                          name = item.filename.rsplit('/', 1)[-1]
                          if (name == digest or name.startswith(digest + '.')) and item.file_size <= 200000:
                              data = json.loads(archive.read(item))
                              report['matches'].append({'archive': str(path.relative_to(root)), 'entry': item.filename, 'diagnostic': data})
              except Exception as error:
                  report['readerErrors'].append({'archive': str(path.relative_to(root)), 'error': str(error)})
          report['found'] = bool(report['matches'])
          text = json.dumps(report, ensure_ascii=False, indent=2)
          text = re.sub(r'(?i)([?&](?:key|token|access_token|api_key)=)[^&\s"<>]+', r'\1[REDACTED]', text)
          Path(os.environ['RUNNER_TEMP'], 'pr57-diagnostic.json').write_text(text)
          PY
      - name: Publish only to PR 57
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            if (context.repo.owner !== 'CarlTherock' || context.repo.repo !== 'CTR-HUNTING') throw new Error('Unexpected repository');
            const fs = require('node:fs');
            const path = require('node:path');
            const text = fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'pr57-diagnostic.json'), 'utf8');
            const safe = text.slice(0, 55000).replace(/`/g, '\\u0060');
            await github.rest.issues.createComment({
              owner: 'CarlTherock', repo: 'CTR-HUNTING', issue_number: 57,
              body: '## Contenu de la pièce jointe du diagnostic E2E\nSource : exécution 42510879123, ressource 507f42727db4624f992a6758edbcd9ae16acc2d1. Lecture de données uniquement. Aucun test, aucune fusion et aucun déploiement exécutés par ce job.\n\n```json\n' + safe + '\n```'
            });
