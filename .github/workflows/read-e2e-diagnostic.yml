name: Read failed E2E logs for PR 59
on:
  push:
    branches: [feat/hunt-quebec-refonte-integree]
    paths: [.github/workflows/read-e2e-diagnostic.yml]
permissions:
  contents: read
concurrency:
  group: read-e2e-pr59-42680293993
  cancel-in-progress: true
jobs:
  read-diagnostic:
    if: github.repository == 'CarlTherock/CTR-HUNTING'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Read the identified failed E2E job and report to PR 59
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = 'CarlTherock', repo = 'CTR-HUNTING';
            const runId = 42680293993, jobId = 129372835476;
            const sha = 'e3b58328b05d74eb1400fb1c7b1840092765cb31';
            if (context.repo.owner !== owner || context.repo.repo !== repo) throw new Error('Unexpected repository');
            const clean = (text) => text
              .replace(/\u001b\[[0-9;]*m/g, '')
              .replace(/([?&](?:key|token|access_token|api_key)=)[^&\s"<>]+/gi, '$1[REDACTED]')
              .replace(/Bearer\s+[A-Za-z0-9._-]+/gi, 'Bearer [REDACTED]')
              .replace(/\b(?:gh[pousr]_[A-Za-z0-9]+|github_pat_[A-Za-z0-9_]+)\b/g, '[REDACTED]')
              .replace(/`/g, '\u0060');
            let body = '## Diagnostic E2E du commit e3b5832\nExécution source : 42680293993 ; job : 129372835476. Lecture du journal existant, sans checkout ni exécution du code applicatif. Extraits limités, non journal intégral.\n\n';
            try {
              const run = (await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId })).data;
              const job = (await github.rest.actions.getJobForWorkflowRun({ owner, repo, job_id: jobId })).data;
              if (run.head_sha !== sha || run.head_branch !== 'feat/hunt-quebec-refonte-integree' || job.run_id !== runId || job.name !== 'e2e' || job.conclusion !== 'failure') throw new Error('Run, commit or job does not match the approved diagnostic');
              const response = await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs', { owner, repo, job_id: jobId });
              const data = response.data;
              let text;
              if (typeof data === 'string') text = data;
              else if (data instanceof ArrayBuffer) text = Buffer.from(data).toString('utf8');
              else if (ArrayBuffer.isView(data)) text = Buffer.from(data.buffer, data.byteOffset, data.byteLength).toString('utf8');
              else throw new Error('Unexpected log response format');
              text = clean(text);
              const lines = text.split('\n');
              const matches = [];
              for (let i = 0; i < lines.length; i++) if (/failed|timed out|TimeoutError|Test timeout|Error:|Expected:|Received:|\.spec\.[cm]?[jt]s:\d+/i.test(lines[i])) matches.push(i);
              const indices = new Set();
              for (const i of matches.slice(-80)) for (let j = Math.max(0, i - 3); j <= Math.min(lines.length - 1, i + 4); j++) indices.add(j);
              const errors = [...indices].sort((a, b) => a - b).map((i) => `${i + 1}: ${lines[i]}`).join('\n').slice(-18000);
              const fence = String.fromCharCode(96).repeat(3);
              body += `Résultat : ${job.conclusion}\n\n### Lignes d’erreur et contexte (18 000 caractères maximum)\n${fence}text\n${errors || 'Aucun motif reconnu : consulter la fin du journal ci-dessous.'}\n${fence}\n\n### Fin du journal (12 000 caractères maximum)\n${fence}text\n${text.slice(-12000)}\n${fence}`;
            } catch (error) {
              body += `Lecture impossible : ${clean(String(error.message || error))}`;
            }
            await github.rest.issues.createComment({ owner, repo, issue_number: 59, body });
