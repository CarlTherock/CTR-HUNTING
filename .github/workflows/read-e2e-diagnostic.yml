name: Read failed CI logs for PR 57
on:
  push:
    branches: [fix/hunt-balayage-et-version-visible]
    paths: [.github/workflows/read-e2e-diagnostic.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: read-ci-pr57-42517922080
  cancel-in-progress: true
jobs:
  read-diagnostic:
    if: github.repository == 'CarlTherock/CTR-HUNTING'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Read only the two identified failed jobs and publish to PR 57
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = 'CarlTherock', repo = 'CTR-HUNTING';
            if (context.repo.owner !== owner || context.repo.repo !== repo) throw new Error('Unexpected repository');
            const run = 42517922080;
            const sha = '95ba652e2d6ee043882637d496a4de33d170a199';
            const jobs = [{ id: 128844972331, name: 'validate' }, { id: 128844972639, name: 'e2e' }];
            const parts = ['## Journaux des contrôles en échec du commit 95ba652\nExécution source : 42517922080. Lecture des journaux existants uniquement ; aucun code du dépôt exécuté et aucun déploiement. Extraits limités aux 18 000 derniers caractères par job.'];
            const clean = (text) => text.replace(/\u001b\[[0-9;]*m/g, '').replace(/([?&](?:key|token|access_token|api_key)=)[^&\s"<>]+/gi, '$1[REDACTED]').replace(/Bearer\s+[A-Za-z0-9._-]+/gi, 'Bearer [REDACTED]').replace(/`/g, '\\u0060');
            for (const target of jobs) {
              try {
                const metadata = await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}', { owner, repo, job_id: target.id });
                const job = metadata.data;
                if (job.run_id !== run || job.name !== target.name || (job.head_sha && job.head_sha !== sha)) throw new Error('Job metadata does not match approved run and commit');
                const response = await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs', { owner, repo, job_id: target.id });
                const data = response.data;
                let text;
                if (typeof data === 'string') text = data;
                else if (data instanceof ArrayBuffer) text = Buffer.from(data).toString('utf8');
                else if (ArrayBuffer.isView(data)) text = Buffer.from(data.buffer, data.byteOffset, data.byteLength).toString('utf8');
                else throw new Error('Unexpected log response format');
                parts.push(`### ${target.name} — ${job.conclusion}\n\n\u0060\u0060\u0060text\n${clean(text.slice(-18000))}\n\u0060\u0060\u0060`);
              } catch (error) {
                parts.push(`### ${target.name}\nLecture impossible : ${clean(String(error.message || error))}`);
              }
            }
            await github.rest.issues.createComment({ owner, repo, issue_number: 57, body: parts.join('\n\n') });
