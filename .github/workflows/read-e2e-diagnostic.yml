name: Read failed CI logs for PR 57
on:
  push:
    branches: [fix/hunt-balayage-et-version-visible]
    paths: [.github/workflows/read-e2e-diagnostic.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: read-ci-pr57-42521433941
  cancel-in-progress: true
jobs:
  read-diagnostic:
    if: github.repository == 'CarlTherock/CTR-HUNTING'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Read the identified validate job and publish only to PR 57
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = 'CarlTherock', repo = 'CTR-HUNTING';
            if (context.repo.owner !== owner || context.repo.repo !== repo) throw new Error('Unexpected repository');
            const run = 42521433941;
            const sha = '3c61c0589f3ccf5b1355580eb98ed11dd4eccf82';
            const jobId = 128855584322;
            const clean = (text) => text.replace(/\u001b\[[0-9;]*m/g, '').replace(/([?&](?:key|token|access_token|api_key)=)[^&\s"<>]+/gi, '$1[REDACTED]').replace(/Bearer\s+[A-Za-z0-9._-]+/gi, 'Bearer [REDACTED]').replace(/`/g, '\\u0060');
            let body = '## Journal validate du commit 3c61c05\nExécution source : 42521433941. Lecture du journal existant uniquement ; aucun code du dépôt exécuté, aucune fusion ni déploiement. Extrait limité aux 18 000 derniers caractères.\n\n';
            try {
              const metadata = await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}', { owner, repo, job_id: jobId });
              const job = metadata.data;
              if (job.run_id !== run || job.name !== 'validate' || (job.head_sha && job.head_sha !== sha)) throw new Error('Job metadata does not match approved run and commit');
              const response = await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs', { owner, repo, job_id: jobId });
              const data = response.data;
              let text;
              if (typeof data === 'string') text = data;
              else if (data instanceof ArrayBuffer) text = Buffer.from(data).toString('utf8');
              else if (ArrayBuffer.isView(data)) text = Buffer.from(data.buffer, data.byteOffset, data.byteLength).toString('utf8');
              else throw new Error('Unexpected log response format');
              body += `Résultat : ${job.conclusion}\n\n\u0060\u0060\u0060text\n${clean(text.slice(-18000))}\n\u0060\u0060\u0060`;
            } catch (error) {
              body += `Lecture impossible : ${clean(String(error.message || error))}`;
            }
            await github.rest.issues.createComment({ owner, repo, issue_number: 57, body });
