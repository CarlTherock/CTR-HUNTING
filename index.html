<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>HuntPro 3D - PWA Edition</title>

  <!-- Bibliothèques Pro via CDN -->
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <!-- Conteneur Principal de la Carte -->
  <div id="map"></div>

  <!-- Interface Utilisateur Superposée -->
  <main class="ui-container">
    
    <!-- En-tête / Barre de statut -->
    <header class="top-bar">
      <h1>HUNTPRO <span>3D</span></h1>
      <div class="status-indicator">
        <span class="dot online"></span> En ligne
      </div>
    </header>

    <!-- Panneau d'outils latéral droit -->
    <aside class="tool-panel">
      <button id="btn-layer-sat" class="tool-btn active" title="Vue Satellite">🛰️</button>
      <button id="btn-layer-topo" class="tool-btn" title="Vue Topographique">🗺️</button>
      <button id="btn-layer-forestry" class="tool-btn" title="Coupes Forestières">🌲</button>
      <div class="divider"></div>
      <button id="btn-3d" class="tool-btn active" title="Activer/Désactiver 3D">3D</button>
      <!-- Le bouton GPS (GeolocateControl) sera injecté ici par MapLibre -->
    </aside>

    <!-- Tiroir du bas : Analyse Météo & Solunaire -->
    <section class="bottom-sheet">
      <div class="sheet-handle"></div>
      
      <div class="stats-grid">
        <div class="stat-card">
          <span class="label">Heure simulée</span>
          <strong id="ui-time">12:00</strong>
        </div>
        <div class="stat-card">
          <span class="label">Pic d'Activité</span>
          <strong id="ui-act" class="highlight-green">--%</strong>
        </div>
        <div class="stat-card">
          <span class="label">Vent (Direction/Vitesse)</span>
          <strong id="ui-wind" class="highlight-blue">--° | -- km/h</strong>
        </div>
      </div>

      <div class="chart-container">
        <canvas id="huntingChart"></canvas>
      </div>
    </section>

  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
